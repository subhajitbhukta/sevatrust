<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="saffronGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#9a3412"/>
    </linearGradient>
    <linearGradient id="petalGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
  </defs>

  <!-- Outer ring -->
  <circle cx="60" cy="60" r="56" fill="none" stroke="url(#goldGrad)" stroke-width="2.5"/>
  <circle cx="60" cy="60" r="52" fill="#7c2d12"/>

  <!-- Lotus petals (5 outer) - representing memorial & purity -->
  <g transform="translate(60 60)">
    <!-- Center petal -->
    <path d="M0,-38 C-6,-28 -6,-18 0,-10 C6,-18 6,-28 0,-38 Z" fill="url(#petalGrad)" opacity="0.95"/>
    <!-- Left & right inner petals -->
    <path d="M0,-30 C-12,-25 -18,-18 -16,-8 C-8,-12 -2,-20 0,-30 Z" fill="url(#petalGrad)" opacity="0.85"/>
    <path d="M0,-30 C12,-25 18,-18 16,-8 C8,-12 2,-20 0,-30 Z" fill="url(#petalGrad)" opacity="0.85"/>
    <!-- Outer left & right petals -->
    <path d="M0,-22 C-18,-20 -26,-12 -22,0 C-12,-10 -4,-16 0,-22 Z" fill="url(#petalGrad)" opacity="0.75"/>
    <path d="M0,-22 C18,-20 26,-12 22,0 C12,-10 4,-16 0,-22 Z" fill="url(#petalGrad)" opacity="0.75"/>
  </g>

  <!-- Heart symbol (humanity) - centered -->
  <g transform="translate(60 70)">
    <path d="M0,8 C-10,-2 -14,-8 -8,-14 C-4,-17 -1,-14 0,-11 C1,-14 4,-17 8,-14 C14,-8 10,-2 0,8 Z" fill="url(#saffronGrad)" stroke="#fef3c7" stroke-width="0.8"/>
  </g>

  <!-- BBMWT monogram letters - bottom -->
  <text x="60" y="96" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#fef3c7" text-anchor="middle" letter-spacing="2">BBMWT</text>
</svg>
